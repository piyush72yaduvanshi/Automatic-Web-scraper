version: '3.8'

services:
  # PostgreSQL Database with pgvector extension for high-performance Vector RAG
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crm_leads_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_leads
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-lead-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_leads"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: crm_leads_redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only
    volumes:
      - redis_data:/data
    networks:
      - crm-lead-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # MinIO High-Performance S3-Compatible Object Storage for Images, Creatives, and Collateral
  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: crm_leads_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_key}
    ports:
      - "127.0.0.1:9000:9000"  # S3 Object Storage API
      - "127.0.0.1:9001:9001"  # MinIO Web Console
    volumes:
      - minio_data:/data
    networks:
      - crm-lead-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Database Migration Service
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_leads_migrate
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL...' &&
        while ! pg_isready -h postgres -U postgres; do sleep 1; done &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Migrations completed successfully'
      "
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/crm_leads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-lead-network
    profiles:
      - migrate

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_leads_backend
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL...' &&
        while ! pg_isready -h postgres -U postgres; do sleep 1; done &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting backend server...' &&
        python main.py
      "
    environment:
      # Application
      APP_NAME: CRM Lead Discovery
      APP_ENV: production
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      
      # Server
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      FRONTEND_URL: http://localhost:3000
      
      # Database - Use Docker service name
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/crm_leads
      DATABASE_POOL_SIZE: 20
      DATABASE_MAX_OVERFLOW: 10
      PGVECTOR_ENABLED: "true"
      VECTOR_DIMENSION: 768
      
      # Redis - Use Docker service name
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # MinIO Object Storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_key}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-crm-assets}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      
      # AI Providers & Integrations (set in .env file)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-crm_whatsapp_verify_token_default}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-ai-sales-crm}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}

      # Provider API Keys (set in .env file)
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_MAPS_ACTOR_ID: ${APIFY_MAPS_ACTOR_ID:-nwua9Gu5YrADL7ZDj}
      APIFY_REQUEST_TIMEOUT: 300
      
      OUTSCRAPER_API_KEY: ${OUTSCRAPER_API_KEY:-}
      OUTSCRAPER_REQUEST_TIMEOUT: 300
      
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACES_REQUEST_TIMEOUT: 30
      
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_REQUEST_TIMEOUT: 60
      FIRECRAWL_MAX_PAGES: 5
      
      SEARCH_API_PROVIDER: serpapi
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_API_TIMEOUT: 30
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      
      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: 60
      RATE_LIMIT_BURST: 10
      
      # Job Configuration
      MAX_RESULTS_PER_JOB: 500
      DEFAULT_SEARCH_RADIUS_KM: 10
      JOB_TIMEOUT_SECONDS: 3600
      
      # Crawler Configuration
      MAX_CONCURRENT_REQUESTS: 5
      REQUEST_DELAY_SECONDS: 1
      MAX_RETRIES: 3
      USER_AGENT: CRM-Lead-Discovery-Bot/1.0
      
      # SSRF Protection
      ALLOW_PRIVATE_IPS: "false"
      BLOCKED_DOMAINS: localhost,127.0.0.1,0.0.0.0
      
      # Logging
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - crm-lead-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Celery Worker for Background Jobs
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_leads_celery_worker
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL and Redis...' &&
        while ! pg_isready -h postgres -U postgres; do sleep 1; done &&
        while ! redis-cli -h redis ping > /dev/null 2>&1; do sleep 1; done &&
        echo 'Starting Celery worker...' &&
        celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
      "
    environment:
      # Same as backend
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/crm_leads
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # MinIO Object Storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_key}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-crm-assets}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      PGVECTOR_ENABLED: "true"
      VECTOR_DIMENSION: 768
      
      # Provider API Keys
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      APIFY_MAPS_ACTOR_ID: ${APIFY_MAPS_ACTOR_ID:-nwua9Gu5YrADL7ZDj}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      OUTSCRAPER_API_KEY: ${OUTSCRAPER_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      
      # Other settings
      LOG_LEVEL: INFO
      MAX_CONCURRENT_REQUESTS: 5
      ALLOW_PRIVATE_IPS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - crm-lead-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_leads_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - crm-lead-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  crm-lead-network:
    driver: bridge
    name: crm-lead-network

volumes:
  postgres_data:
    name: crm_leads_postgres_data
  redis_data:
    name: crm_leads_redis_data
  minio_data:
    name: crm_leads_minio_data

version: '3.8'

services:
  # PostgreSQL Database with pgvector extension for high-performance Vector RAG
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crm_leads_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: crm_leads
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-lead-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_leads"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: crm_leads_redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"  # Bind to localhost only
    volumes:
      - redis_data:/data
    networks:
      - crm-lead-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped

  # MinIO High-Performance S3-Compatible Object Storage for Images, Creatives, and Collateral
  minio:
    image: minio/minio
    container_name: crm_leads_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret_key}
    ports:
      - "127.0.0.1:9000:9000"  # S3 Object Storage API
      - "127.0.0.1:9001:9001"  # MinIO Web Console
    volumes:
      - minio_data:/data
    networks:
      - crm-lead-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

networks:
  crm-lead-network:
    driver: bridge
    name: crm-lead-network

volumes:
  postgres_data:
    name: crm_leads_postgres_data
  redis_data:
    name: crm_leads_redis_data
  minio_data:
    name: crm_leads_minio_data
